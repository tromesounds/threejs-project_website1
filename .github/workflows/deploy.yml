name: Deploy Vite to Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Shallow clones can miss deps

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'  # Cache node_modules

      - name: Show available npm scripts
        run: npm run  # This lists all scripts (for debugging)

      - name: Install dependencies
        run: npm install  # Basic install first, then ci for lockfile

      - name: Install with lockfile
        run: npm ci

      - name: Build with Vite
        run: npm run build -- --base /

      - name: Show build output
        run: ls -la dist/  # Verify what was built

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4